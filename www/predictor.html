<!DOCTYPE html>
<html>
<head>
<title data-i18n=predictor_title></title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<link rel=stylesheet href=/main-new.css>
<link rel=stylesheet href=/local.css>
<link rel=stylesheet href=/predictor.css>
<script src=/jquery.min.js></script>
<script src=/main.js></script>
<script src=/event-url.js></script>
<script src=/stats-config.js></script>
<script src=/predictor.js></script>
<script src=/local.js></script>
<link rel=icon type=image/png href=/logo.png>
</head><body><main>
<h1 data-i18n=predictor_title></h1>

<details id=alliances-area>
	<summary data-i18n=alliances_heading></summary>
	<div id=modeToggle>
		<button data-mode=qual class=active data-i18n=qual_mode></button>
		<button data-mode=playoff data-i18n=playoff_mode></button>
	</div>

	<label id=playoffStatsToggle style=display:none><span class=switch-label data-i18n=use_playoff_stats></span> <span class=switch><input type=checkbox id=usePlayoffStats><span class=slider></span></span></label>

	<div class=matchPick><span data-i18n=match_label></span> <select id=matchList></select></div>

	<div id=backupSection style=display:none>
		<span class=backupTitle data-i18n=backup_section_label></span>
		<div id=backupGrid>
			<div class=backupRow id=backupRow0>
				<span data-i18n=backup_team_label></span><select id=backupTeamSelect0></select>
				<span data-i18n=backup_replacing_label></span><select id=backupReplacingSelect0></select>
			</div>
			<div class="backupRow hide" id=backupRow1>
				<span data-i18n=backup_team_label></span><select id=backupTeamSelect1></select>
				<span data-i18n=backup_replacing_label></span><select id=backupReplacingSelect1></select>
			</div>
		</div>
	</div>

	<div class=poolHeader>
		<span id=poolLabel data-i18n=team_pool_label></span>
		<button id=change-teams data-i18n=change_teams_button></button>
	</div>
	<div id=teamPool></div>
</details>

<div id=breakdown>
	<table id=prediction><thead><tr>
		<th class=redTeamBG id=th-R1></th>
		<th class=redTeamBG id=th-R2></th>
		<th class="redTeamBG noftc" id=th-R3></th>
		<th class=redTeamBG><div data-i18n=red_heading></div></th>
		<th></th>
		<th class=blueTeamBG><div data-i18n=blue_heading></div></th>
		<th class=blueTeamBG id=th-B1></th>
		<th class=blueTeamBG id=th-B2></th>
		<th class="blueTeamBG noftc" id=th-B3></th>
	</tr></thead><tbody></tbody></table>
</div>

<div class=dataModel hidden>
	<input id=R1><input id=R2><input id=R3><input id=B1><input id=B2><input id=B3>
</div>
</body></main></html>
