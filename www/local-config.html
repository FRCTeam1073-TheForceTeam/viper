<!DOCTYPE html>
<html>
<head>
<title data-i18n=local_config_title></title>
<meta name=viewport content="width=device-width,initial-scale=1.0">
<meta charset=UTF-8>
<link rel=stylesheet href="/main.css?v=menu1">
<link rel=stylesheet href=/local.css>
<link rel=stylesheet href="/local-config.css?v=accounts1">
<script src=/jquery.min.js></script>
<script src="/main.js?v=probe1"></script>
<script src=/local.js onload="window.localJsLoaded=true"></script>
<script src="/local-config.js?v=accounts1"></script>
<link rel=icon type=image/png href=/logo.png>
</head>
<body data-require-role=admin>
<div id=main>
<h1 data-i18n=local_config_title></h1>

<div id=loading data-i18n=local_config_loading></div>

<form id=local-config-form style=display:none method=POST action=/admin/local-config.cgi>
	<div class=form-group>
		<label for=form-ourTeam data-i18n=local_config_team_number></label>
		<input id=form-ourTeam type=number min=0 max=99999 name=ourTeam>
	</div>

	<div class=form-group>
		<label for=form-showScoutingComments>
			<input id=form-showScoutingComments type=checkbox name=showScoutingComments>
			<span data-i18n=local_config_scouting_comments></span>
		</label>
	</div>

	<div class=form-group>
		<label for=form-showReviewRequest>
			<input id=form-showReviewRequest type=checkbox name=showReviewRequest>
			<span data-i18n=local_config_review_requests></span>
		</label>
	</div>

	<div class=form-group>
		<label for=form-transferHosts data-i18n=local_config_transfer_hosts></label>
		<textarea id=form-transferHosts rows=4 placeholder="localhost&#10;example.com&#10;192.168.1.1:8080"></textarea>
		<small data-i18n=local_config_transfer_hosts_help></small>
	</div>

	<div id=message-area></div>

	<input type=hidden id=transferHosts-json name=transferHosts>
	<button type=submit data-i18n=local_config_save></button>
</form>

<section id=accounts style=display:none>
	<h2 data-i18n=accounts_heading></h2>
	<p class=accountsIntro data-i18n=accounts_intro></p>
	<table id=accountsTable>
		<thead><tr><th data-i18n=accounts_col_account></th><th data-i18n=accounts_col_role></th><th data-i18n=accounts_col_can></th></tr></thead>
		<tbody></tbody>
	</table>
	<h3 data-i18n=accounts_howto_heading></h3>
	<ol id=accountsHowTo>
		<li><span data-i18n=accounts_step_edit></span><br><code id=accountsConfLine></code></li>
		<li><span data-i18n=accounts_step_run></span><br><code id=accountsCommand></code></li>
		<li data-i18n=accounts_step_password></li>
	</ol>
	<p class=accountsNote data-i18n=accounts_note></p>
</section>
</div>
</body>
</html>
