<!DOCTYPE html>
<html>
<head>
<title data-i18n=add_event_title></title>
<meta name=viewport content="width=device-width,initial-scale=1.0">
<meta charset=UTF-8>
<link rel=stylesheet href=/main-new.css>
<link rel=stylesheet href=/local.css>
<link rel=stylesheet href=/add-event.css>
<script src=/jquery.min.js></script>
<script src=/main.js></script>
<script src=/auto-year.js></script>
<script src=/add-event.js></script>
<script src=/local.js></script>
<link rel=icon type=image/png href=/logo.png>
</head>
<body>
<main>
<h1 data-i18n=add_event_title></h1>
<label class="card max-wrapping-width">
	<span data-i18n=add_event_comp_type></span> <select id=comp>
		<option value=frc>FRC</option>
		<option value=ftc>FTC</option>
	</select>
</label>
<div class="grid max-wrapping-width">
<a href="/event-data-entry.html#_COMP_" class="card">
	<h3 data-i18n=add_event_data_entry_title></h3>
	<div data-i18n=add_event_data_entry_description></div>
</a>
<a href="/event-upload.html#_COMP_" class="card">
	<h3 data-i18n=add_event_upload_title></h3>
	<div data-i18n=add_event_upload_description></div>
</a>
<a href="/api-events.html#_SEASON_" class="card">
	<h3 data-i18n=add_event_api_title></h3>
	<div data-i18n=add_event_api_description></div>
</a>
<div class="card">
	<h3 data-i18n=add_event_import_title></h3>
	<p data-i18n=add_event_import_description></p>
	<form method=POST action=/admin/import.cgi enctype=multipart/form-data>
		<p>
			<label class=button>
				<span data-i18n=add_event_import_choose></span><input type=file name=json accept=application/json>
			</label>
			<span class=file-name></span>
		</p>
		<input type=submit data-i18n-value=add_event_import_upload>
	</form>
</div>
</div>
</main>
</body>
</html>
