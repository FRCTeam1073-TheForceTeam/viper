name: Build iOS & Android

on:
  push:
    branches:
      - master
      - main
      - mobile-app
    paths:
      - 'app/**'
      - '.github/workflows/build-all.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd app
          flutter pub get

      - name: Run flutter analyze
        run: |
          cd app
          flutter analyze

      - name: Run flutter format check
        run: |
          cd app
          flutter format --set-exit-if-changed lib/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd app
          flutter pub get

      - name: Run tests
        run: |
          cd app
          flutter test

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get dependencies
        run: |
          cd app
          flutter pub get

      - name: Create Android platform
        run: |
          cd app
          flutter create --platforms=android .

      - name: Build APK
        run: |
          cd app
          flutter build apk --release

      - name: Build AAB (App Bundle)
        run: |
          cd app
          flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd app
          flutter pub get

      - name: Create iOS platform
        run: |
          cd app
          flutter create --platforms=ios .

      - name: Build iOS
        run: |
          cd app
          flutter build ios --release

      - name: Create IPA
        run: |
          cd app/build/ios/Release-iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r app-release.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app/build/ios/Release-iphoneos/app-release.ipa
          retention-days: 30
